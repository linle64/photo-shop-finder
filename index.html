<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>拍照找货</title>
<meta name="theme-color" content="#101828">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9edf2;--ink:#101828;--mute:#5b6678;--line:#c9d1dc;--card:#f7f9fb;--blue:#2b50ff;--flash:#ffd23f}
@media (prefers-color-scheme:dark){:root{--bg:#0d121b;--ink:#eef1f6;--mute:#93a0b5;--line:#263042;--card:#161d2a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Bricolage Grotesque",-apple-system,"PingFang SC","Noto Sans SC",sans-serif;padding:max(20px,env(safe-area-inset-top)) 16px 48px}
main{max-width:560px;margin:0 auto}
h1{font-size:2.4rem;line-height:1.05;font-weight:800;letter-spacing:-.02em;margin:8px 0 6px}
.sub{color:var(--mute);margin:0 0 20px;max-width:30ch}
.finder{position:relative;aspect-ratio:4/3;background:var(--ink);border-radius:6px;overflow:hidden;display:grid;place-items:center}
.finder img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none}
.finder.has img{display:block}
.finder .hint{color:#9aa6bb;text-align:center;padding:0 24px}
.finder.has .hint{display:none}
.finder i{position:absolute;width:28px;height:28px;border:4px solid var(--flash);pointer-events:none}
.finder i:nth-of-type(1){top:12px;left:12px;border-right:0;border-bottom:0}
.finder i:nth-of-type(2){top:12px;right:12px;border-left:0;border-bottom:0}
.finder i:nth-of-type(3){bottom:12px;right:12px;border-left:0;border-top:0}
.finder i:nth-of-type(4){bottom:12px;left:12px;border-right:0;border-top:0}
.finder.busy i{animation:pulse .9s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(.82)}}
@media (prefers-reduced-motion:reduce){.finder.busy i{animation:none}}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 0}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:6px;padding:14px;cursor:pointer;text-align:center;text-decoration:none;display:block}
.primary{background:var(--blue);color:#fff}
.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
:focus-visible{outline:3px solid var(--flash);outline-offset:2px}
input[type=file]{display:none}
section{margin-top:28px}
h2{font-size:1.1rem;margin:0 0 10px}
#status{color:var(--mute);margin:12px 0 0;min-height:1.5em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:8px 12px;font-weight:500}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kw{width:100%;font:inherit;padding:12px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.note{color:var(--mute);font-size:.875rem;margin:6px 0 0}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tabs button{flex:1;background:transparent;border:1px solid var(--line);color:var(--ink)}
.tabs button[aria-selected=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.shops{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shops a{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:16px 12px}
.shops a:active{background:var(--line)}
.keybox{margin-top:32px;border-top:1px solid var(--line);padding-top:16px}.keybox summary{cursor:pointer;font-weight:700}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>拍照找货</h1>
  <p class="sub">在日本看到想买的东西？拍下来，对比日本网店、国内平台和附近门店。</p>

  <div class="finder" id="finder">
    <img id="preview" alt="已选择的物品照片">
    <p class="hint">拍摄或上传一张物品照片</p>
    <i></i><i></i><i></i><i></i>
  </div>
  <div class="actions">
    <label class="btn primary" tabindex="0" id="camBtn">拍照<input id="cam" type="file" accept="image/*" capture="environment"></label>
    <label class="btn ghost" tabindex="0" id="upBtn">上传照片<input id="up" type="file" accept="image/*"></label>
  </div>
  <p id="status" role="status"></p>

  <section id="result" hidden>
    <h2>识别结果（从具体到通用）</h2>
    <div class="chips" id="chips"></div>
    <input class="kw" id="kw" aria-label="搜索关键词" placeholder="搜索关键词">
    <p class="note">日本网店用日文，国内平台用中文。结果不准时可直接修改，或选更通用的一项。价格请在各站页面查看。</p>

    <section>
      <h2>比价</h2>
      <div class="tabs" role="tablist">
        <button role="tab" id="t-jp" aria-selected="true">日本网店</button>
        <button role="tab" id="t-cn" aria-selected="false">国内平台</button>
        <button role="tab" id="t-store" aria-selected="false">附近门店</button>
      </div>
      <div class="shops" id="shops"></div>
      <p class="note" id="shopnote"></p>
    </section>

    <section>
      <h2>用图片搜</h2>
      <div class="shops">
        <button class="ghost" id="copy">复制图片</button>
        <a class="btn ghost" href="https://lens.google.com/" target="_blank" rel="noopener">Google 图片搜索</a>
        <a class="btn ghost" href="https://www.bing.com/visualsearch" target="_blank" rel="noopener">Bing 视觉搜索</a>
        <a class="btn ghost" href="https://www.taobao.com/" target="_blank" rel="noopener">淘宝（点相机图标）</a>
      </div>
      <p class="note">先点“复制图片”，打开对应网站后粘贴即可。</p>
    </section>
  </section>
  <details id="keybox" class="keybox">
    <summary>Gemini 密钥（免费）</summary>
    <p class="note">在 aistudio.google.com/apikey 免费申请。密钥只保存在这台设备的浏览器里，照片只发给 Google 做识别。</p>
    <input class="kw" id="key" type="password" autocomplete="off" aria-label="Gemini 密钥" placeholder="粘贴密钥">
    <button class="ghost" id="saveKey" style="margin-top:8px;width:100%">保存密钥</button>
  </details>
</main>

<script>
const MODEL = 'gemini-3.8-flash';
const PROMPT = '识别图中的商品，给出 3 个购物网站搜索关键词，按从具体到通用排序：第 1 个是品牌加型号或款式，第 2 个是商品类型加关键特征（颜色、材质、用途），第 3 个只写品类。每个关键词同时给中文、英文、日文，日文要用日本网店里实际使用的说法。品牌或型号看不清时不要编造，直接写类型加特征。另外判断这件商品在日本通常去哪类店买：drugstore（药妆）、electronics（电器数码）、discount（唐吉诃德类杂货）、supermarket（超市食品）、department（百货服饰）、other。';
const KEYWORD = { type: 'OBJECT', required: ['zh', 'en', 'jp'], properties: { zh: { type: 'STRING' }, en: { type: 'STRING' }, jp: { type: 'STRING' } } };
const SCHEMA = { type: 'OBJECT', required: ['keywords', 'storeType'], properties: { keywords: { type: 'ARRAY', items: KEYWORD }, storeType: { type: 'STRING', enum: ['drugstore', 'electronics', 'discount', 'supermarket', 'department', 'other'] } } };
const SHOPS = {
  jp: [
    ['Amazon 日本', 'https://www.amazon.co.jp/s?k='],
    ['乐天市场', 'https://search.rakuten.co.jp/search/mall/', '/'],
    ['Yahoo! 购物', 'https://shopping.yahoo.co.jp/search?p='],
    ['价格.com（比价）', 'https://kakaku.com/search_results/', '/'],
    ['Mercari（二手）', 'https://jp.mercari.com/search?keyword='],
    ['Yodobashi', 'https://www.yodobashi.com/?word='],
    ['Bic Camera', 'https://www.biccamera.com/bc/category/?q=']
  ],
  cn: [
    ['淘宝', 'https://s.taobao.com/search?q='],
    ['京东', 'https://search.jd.com/Search?keyword='],
    ['拼多多', 'https://mobile.yangkeduo.com/search_result.html?search_key=']
  ]
};
const STORES = {
  drugstore: ['松本清', 'Sundrug', 'Tsuruha', '唐吉诃德'],
  electronics: ['Yodobashi Camera', 'Bic Camera', 'Yamada Denki', 'Edion'],
  discount: ['唐吉诃德', '大创 Daiso', '无印良品'],
  supermarket: ['超市', '便利店', '唐吉诃德'],
  department: ['百货商店', 'UNIQLO', 'Beams', 'ABC-MART'],
  other: ['唐吉诃德', '百货商店', 'LOFT', '东急手创馆']
};
const TAB_KEY = { jp: 'jp', cn: 'zh', store: 'jp' };
let storeType = 'other';
const $ = id => document.getElementById(id);
let market = 'jp', blob = null, items = [], current = 0;

function renderShops() {
  const kw = $('kw').value.trim();
  const q = encodeURIComponent(kw);
  const links = market === 'store'
    ? STORES[storeType].map(n => [n, 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(n)])
    : SHOPS[market].map(([name, url, tail = '']) => [name, url + q + tail]);
  $('shops').replaceChildren(...links.map(([name, href]) => {
    const a = document.createElement('a');
    a.className = 'btn';
    a.textContent = name;
    a.href = href;
    a.target = '_blank';
    a.rel = 'noopener';
    return a;
  }));
  $('shopnote').textContent = market === 'store' ? '点击后在地图中搜索附近门店，到店后可拿手机对照商品价格。' : '';
}

function setMarket(m) {
  market = m;
  if (items.length) $('kw').value = items[current][TAB_KEY[m]];
  for (const t of ['jp', 'cn', 'store']) $('t-' + t).setAttribute('aria-selected', t === m);
  renderShops();
}
for (const t of ['jp', 'cn', 'store']) $('t-' + t).onclick = () => setMarket(t);
$('kw').oninput = renderShops;
for (const id of ['camBtn', 'upBtn']) {
  $(id).onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $(id).querySelector('input').click(); } };
}

function pick(i) {
  current = i;
  $('kw').value = items[i][TAB_KEY[market]];
  for (const [j, c] of [...$('chips').children].entries()) c.setAttribute('aria-pressed', j === i);
  renderShops();
}

async function handle(file) {
  if (!file) return;
  const finder = $('finder');
  const img = $('preview');
  blob = file;
  img.src = URL.createObjectURL(file);
  finder.classList.add('has');
  $('result').hidden = true;
  const key = localStorage.getItem('gemini-key');
  if (!key) {
    $('keybox').open = true;
    $('status').textContent = '先在页面底部填入 Gemini 密钥，才能识别商品。';
    return;
  }
  finder.classList.add('busy');
  $('status').textContent = '正在识别商品…';
  await img.decode();
  const scale = Math.min(1, 1024 / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth * scale);
  c.height = Math.round(img.naturalHeight * scale);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const data = c.toDataURL('image/jpeg', 0.85).split(',')[1];
  const body = JSON.stringify({
    contents: [{ parts: [{ inline_data: { mime_type: 'image/jpeg', data } }, { text: PROMPT }] }],
    generationConfig: { responseMimeType: 'application/json', responseSchema: SCHEMA }
  });
  let res;
  for (let attempt = 1; attempt <= 4; attempt++) {
    res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`, {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-goog-api-key': key },
      body
    });
    if (res.status !== 503 && res.status !== 429) break;
    $('status').textContent = `服务繁忙，正在重试（${attempt}/3）…`;
    await new Promise(r => setTimeout(r, attempt * 2000));
  }
  finder.classList.remove('busy');
  if (!res.ok) {
    const err = await res.json();
    $('status').textContent = `识别失败（${res.status}）：${err.error.message}`;
    return;
  }
  const out = JSON.parse((await res.json()).candidates[0].content.parts[0].text);
  items = out.keywords;
  storeType = out.storeType;
  $('chips').replaceChildren(...items.map((it, i) => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = it.zh;
    b.onclick = () => pick(i);
    return b;
  }));
  pick(0);
  $('status').textContent = '';
  $('result').hidden = false;
}
$('cam').onchange = e => handle(e.target.files[0]);
$('up').onchange = e => handle(e.target.files[0]);

$('saveKey').onclick = () => {
  localStorage.setItem('gemini-key', $('key').value.trim());
  $('key').value = '';
  $('keybox').open = false;
  $('status').textContent = '密钥已保存在这台设备上。';
  if (blob) handle(blob);
};

$('copy').onclick = async () => {
  const c = document.createElement('canvas');
  const img = $('preview');
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  c.getContext('2d').drawImage(img, 0, 0);
  const png = await new Promise(r => c.toBlob(r, 'image/png'));
  await navigator.clipboard.write([new ClipboardItem({ 'image/png': png })])
    .then(() => $('copy').textContent = '已复制，去粘贴吧', () => $('copy').textContent = '浏览器不支持，请长按图片保存');
};

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
