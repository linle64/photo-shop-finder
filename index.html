<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>拍照找货</title>
<meta name="theme-color" content="#101828">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<style>
:root{--bg:#e9edf2;--ink:#101828;--mute:#5b6678;--line:#c9d1dc;--card:#f7f9fb;--blue:#2b50ff;--flash:#ffd23f;--err:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#0d121b;--ink:#eef1f6;--mute:#93a0b5;--line:#263042;--card:#161d2a;--err:#ff8a7a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"PingFang SC","Hiragino Sans","Noto Sans SC",sans-serif;padding:max(20px,env(safe-area-inset-top)) 16px 48px}
main{max-width:560px;margin:0 auto}
h1{font-size:2.2rem;line-height:1.1;font-weight:800;letter-spacing:-.02em;margin:8px 0 6px}
.sub{color:var(--mute);margin:0 0 20px}
.finder{position:relative;aspect-ratio:4/3;background:var(--ink);border-radius:6px;overflow:hidden;display:grid;place-items:center}
.finder img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none}
.finder.has img{display:block}
.finder .hint{color:#9aa6bb;text-align:center;padding:0 24px}
.finder.has .hint{display:none}
.finder i{position:absolute;width:28px;height:28px;border:4px solid var(--flash);pointer-events:none}
.finder i:nth-of-type(1){top:12px;left:12px;border-right:0;border-bottom:0}
.finder i:nth-of-type(2){top:12px;right:12px;border-left:0;border-bottom:0}
.finder i:nth-of-type(3){bottom:12px;right:12px;border-left:0;border-top:0}
.finder i:nth-of-type(4){bottom:12px;left:12px;border-right:0;border-top:0}
.finder.busy i{animation:pulse .9s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(.82)}}
@media (prefers-reduced-motion:reduce){.finder.busy i{animation:none}}
.actions{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin:12px 0 0}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:6px;padding:14px;cursor:pointer;text-align:center;text-decoration:none;display:block}
.primary{background:var(--blue);color:#fff}
.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
:focus-visible{outline:3px solid var(--flash);outline-offset:2px}
input[type=file]{display:none}
section{margin-top:24px}
h2{font-size:1.1rem;margin:0 0 10px}
#status{margin:12px 0 0;min-height:1.5em;color:var(--mute)}
#status.error{color:var(--err)}
.privacy{color:var(--mute);font-size:.8125rem;margin:8px 0 0}
.summary{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px}
.summary b{display:block;font-size:1.1rem;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:8px 12px;font-weight:500}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kw{width:100%;font:inherit;padding:12px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.note{color:var(--mute);font-size:.875rem;margin:6px 0 0}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tabs button{flex:1;background:transparent;border:1px solid var(--line);color:var(--ink);padding:12px 6px}
.tabs button[aria-selected=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.shops{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shops a{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:16px 12px}
.shops a.first{grid-column:1/-1;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.shops a:active{background:var(--line)}
details{margin-top:24px;border-top:1px solid var(--line);padding-top:14px}
summary{cursor:pointer;font-weight:700}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>拍照找货</h1>
  <p class="sub">在日本看到想买的东西？拍下来，一键比价。</p>

  <div class="finder" id="finder">
    <img id="preview" alt="已选择的物品照片">
    <p class="hint">拍摄或上传一张商品照片</p>
    <i></i><i></i><i></i><i></i>
  </div>
  <div class="actions">
    <label class="btn primary" tabindex="0" id="camBtn">拍照识别<input id="cam" type="file" accept="image/*" capture="environment"></label>
    <label class="btn ghost" tabindex="0" id="upBtn">相册<input id="up" type="file" accept="image/*"></label>
  </div>
  <p id="status" role="status"></p>
  <p class="privacy">照片仅用于识别商品，由 Google Gemini 处理。请避免拍到人脸、证件和个人信息。</p>

  <section id="result" hidden>
    <div class="summary"><b id="sumTitle"></b><span id="sumText"></span></div>

    <section>
      <h2>识别结果</h2>
      <div class="chips" id="chips"></div>
      <input class="kw" id="kw" aria-label="搜索关键词" placeholder="搜索关键词">
      <p class="note">不准的话，点更通用的一项，或直接修改。</p>
    </section>

    <section>
      <h2>比价</h2>
      <div class="tabs" role="tablist">
        <button role="tab" id="t-jp" aria-selected="true">日本网店</button>
        <button role="tab" id="t-cn" aria-selected="false">国内平台</button>
        <button role="tab" id="t-store" aria-selected="false">附近门店</button>
      </div>
      <div class="shops" id="shops"></div>
      <p class="note" id="shopnote"></p>
    </section>

    <details>
      <summary>退税提醒</summary>
      <p class="note">日本免税购物自 2026 年 11 月起改为：店里先付含税价，出境时办理手续后再退还消费税。具体条件和截止日期请以日本观光厅官方说明为准。</p>
    </details>
  </section>

  <details id="keybox" class="keybox" hidden>
    <summary>使用自己的 Gemini 密钥</summary>
    <p class="note">在 aistudio.google.com/apikey 申请。密钥只保存在这台设备的浏览器里。</p>
    <input class="kw" id="key" type="password" autocomplete="off" aria-label="Gemini 密钥" placeholder="粘贴密钥">
    <button class="ghost" id="saveKey" style="margin-top:8px;width:100%">保存密钥</button>
  </details>
</main>

<script>
// 识别代理地址。部署 worker/ 后填在这里，游客就不需要自己的密钥；留空则使用"自己的密钥"模式。
const API_URL = '';

// 以下提示词和 worker/index.js 保持一致，仅在自己的密钥模式使用。
const MODEL = 'gemini-3.8-flash';
const PROMPT = '你在帮来日本旅游的中文游客识别商品。识别图中的主要商品，输出：1) keywords：3 个购物网站搜索关键词，按从具体到通用排序（第 1 个是品牌加型号或款式，第 2 个是商品类型加关键特征，第 3 个只写品类），每个同时给中文 zh、英文 en、日文 jp，日文要用日本网店里实际使用的说法；品牌或型号看不清时不要编造。2) storeType：这件商品在日本通常去哪类店买。3) summary：用不超过 60 个中文字说明这是什么、怎么用、需要注意什么（如成分、适用人群、保质期）；包装上有日文时翻译要点。';
const KEYWORD = { type: 'OBJECT', required: ['zh', 'en', 'jp'], properties: { zh: { type: 'STRING' }, en: { type: 'STRING' }, jp: { type: 'STRING' } } };
const SCHEMA = {
  type: 'OBJECT',
  required: ['keywords', 'storeType', 'summary'],
  properties: {
    keywords: { type: 'ARRAY', minItems: 1, maxItems: 3, items: KEYWORD },
    storeType: { type: 'STRING', enum: ['drugstore', 'electronics', 'discount', 'supermarket', 'department', 'other'] },
    summary: { type: 'STRING' }
  }
};

const SHOPS = {
  jp: [
    ['价格.com（日本最低价）', 'https://search.kakaku.com/', '/'],
    ['Amazon 日本', 'https://www.amazon.co.jp/s?k='],
    ['乐天市场', 'https://search.rakuten.co.jp/search/mall/', '/'],
    ['Yahoo! 购物', 'https://shopping.yahoo.co.jp/search?p='],
    ['Mercari（二手）', 'https://jp.mercari.com/search?keyword='],
    ['Yodobashi', 'https://www.yodobashi.com/?word='],
    ['Bic Camera', 'https://www.biccamera.com/bc/category/?q=']
  ],
  cn: [
    ['淘宝', 'https://s.taobao.com/search?q='],
    ['京东', 'https://so.m.jd.com/ware/search.action?keyword='],
    ['拼多多', 'https://mobile.yangkeduo.com/search_result.html?search_key=']
  ]
};
// [按钮文字, 地图搜索词]：在日本的地图里用日文名命中更好
const STORES = {
  drugstore: [['松本清', 'マツモトキヨシ'], ['Sundrug', 'サンドラッグ'], ['Tsuruha', 'ツルハドラッグ'], ['唐吉诃德', 'ドン・キホーテ']],
  electronics: [['Yodobashi', 'ヨドバシカメラ'], ['Bic Camera', 'ビックカメラ'], ['Yamada 电器', 'ヤマダデンキ'], ['Edion', 'エディオン']],
  discount: [['唐吉诃德', 'ドン・キホーテ'], ['大创', 'ダイソー'], ['无印良品', '無印良品']],
  supermarket: [['超市', 'スーパー'], ['便利店', 'コンビニ'], ['唐吉诃德', 'ドン・キホーテ']],
  department: [['百货商店', '百貨店'], ['优衣库', 'ユニクロ'], ['ABC-MART', 'ABCマート']],
  other: [['唐吉诃德', 'ドン・キホーテ'], ['百货商店', '百貨店'], ['LOFT', 'ロフト'], ['东急手创馆', '東急ハンズ']]
};
const TAB_KEY = { jp: 'jp', cn: 'zh', store: 'jp' };

const $ = id => document.getElementById(id);
let market = 'jp', items = [], current = 0, storeType = 'other', lastFile = null, job = 0, previewUrl = '';

if (!API_URL) $('keybox').hidden = false;

function renderShops() {
  const q = encodeURIComponent($('kw').value.trim());
  const links = market === 'store'
    ? STORES[storeType].map(([label, query]) => [label, 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(query)])
    : SHOPS[market].map(([name, url, tail = '']) => [name, url + q + tail]);
  $('shops').replaceChildren(...links.map(([name, href], i) => {
    const a = document.createElement('a');
    a.className = i === 0 && market === 'jp' ? 'btn first' : 'btn';
    a.textContent = name;
    a.href = href;
    a.target = '_blank';
    a.rel = 'noopener';
    return a;
  }));
  $('shopnote').textContent = market === 'store'
    ? '点击后在地图里搜索附近门店，到店后可对照价格。'
    : market === 'cn' ? '国内平台价格为人民币，部分是代购价，仅供参考。部分页面需要登录或打开 App。' : '';
}

function setMarket(m) {
  market = m;
  if (items.length) $('kw').value = items[current][TAB_KEY[m]];
  for (const t of ['jp', 'cn', 'store']) $('t-' + t).setAttribute('aria-selected', t === m);
  renderShops();
}
for (const t of ['jp', 'cn', 'store']) $('t-' + t).onclick = () => setMarket(t);
$('kw').oninput = renderShops;
for (const id of ['camBtn', 'upBtn']) {
  $(id).onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $(id).querySelector('input').click(); } };
}

function pick(i) {
  current = i;
  $('kw').value = items[i][TAB_KEY[market]];
  for (const [j, c] of [...$('chips').children].entries()) c.setAttribute('aria-pressed', j === i);
  renderShops();
}

function setStatus(text, isError = false) {
  $('status').textContent = text;
  $('status').classList.toggle('error', isError);
}

async function handle(file) {
  if (!file) return;
  const my = ++job;
  lastFile = file;
  const finder = $('finder');
  const img = $('preview');
  if (previewUrl) URL.revokeObjectURL(previewUrl);
  previewUrl = URL.createObjectURL(file);
  img.src = previewUrl;
  finder.classList.add('has');
  $('result').hidden = true;

  const key = API_URL ? '' : localStorage.getItem('gemini-key');
  if (!API_URL && !key) {
    $('keybox').open = true;
    setStatus('先在页面底部填入 Gemini 密钥，才能识别商品。');
    return;
  }

  finder.classList.add('busy');
  setStatus('正在识别商品…');
  const stop = () => finder.classList.remove('busy');
  const fail = msg => { stop(); setStatus(msg, true); };

  await img.decode().catch(() => { throw new Error('这张图片无法打开，请换一张 JPG 或 PNG 照片。'); });
  const scale = Math.min(1, 1024 / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth * scale);
  c.height = Math.round(img.naturalHeight * scale);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const data = c.toDataURL('image/jpeg', 0.85).split(',')[1];

  const request = API_URL
    ? () => fetch(API_URL, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ image: data }), signal: AbortSignal.timeout(30000) })
    : () => fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`, {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'x-goog-api-key': key },
        body: JSON.stringify({
          contents: [{ parts: [{ inline_data: { mime_type: 'image/jpeg', data } }, { text: PROMPT }] }],
          generationConfig: { responseMimeType: 'application/json', responseSchema: SCHEMA }
        }),
        signal: AbortSignal.timeout(30000)
      });

  let res;
  for (let attempt = 0; attempt <= 3; attempt++) {
    res = await request().catch(() => null);
    if (!res) return fail('连不上识别服务。请检查网络；若在中国大陆漫游，换日本本地网络或 Wi‑Fi 后重试。');
    if (res.status !== 503) break;
    if (attempt < 3) {
      setStatus(`服务繁忙，正在重试（${attempt + 1}/3）…`);
      await new Promise(r => setTimeout(r, (attempt + 1) * 2000));
    }
  }
  if (my !== job) return;
  if (res.status === 429) return fail('今天的识别次数用完了，请稍后再试。');
  if (res.status === 400 || res.status === 403) return fail(API_URL ? '识别服务暂时不可用。' : '密钥无效，请在页面底部重新填写。');
  if (!res.ok) return fail('识别服务繁忙，请稍后再试。');

  const body = await res.json().catch(() => null);
  const text = API_URL ? JSON.stringify(body) : body?.candidates?.[0]?.content?.parts?.[0]?.text;
  const out = text && JSON.parse(text);
  if (!out?.keywords?.length) return fail(body?.error || '这张照片没能识别，请换个角度再拍。');

  stop();
  items = out.keywords;
  storeType = out.storeType in STORES ? out.storeType : 'other';
  $('sumTitle').textContent = items[0].zh;
  $('sumText').textContent = out.summary || '';
  $('chips').replaceChildren(...items.map((it, i) => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = it.zh;
    b.onclick = () => pick(i);
    return b;
  }));
  pick(0);
  setStatus('');
  $('result').hidden = false;
}

function run(input) {
  const file = input.files[0];
  input.value = '';
  handle(file).catch(e => { $('finder').classList.remove('busy'); setStatus(e.message || '出错了，请重试。', true); });
}
$('cam').onchange = e => run(e.target);
$('up').onchange = e => run(e.target);

$('saveKey').onclick = () => {
  localStorage.setItem('gemini-key', $('key').value.trim());
  $('key').value = '';
  $('keybox').open = false;
  setStatus('密钥已保存在这台设备上。');
  if (lastFile) handle(lastFile).catch(e => setStatus(e.message, true));
};

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
